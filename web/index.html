<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var KEY = 'circulate-theme';
        var resolved;
        try {
          var stored = localStorage.getItem(KEY);
          if (stored === 'light' || stored === 'dark') {
            resolved = stored;
          } else if (stored === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
            localStorage.setItem(KEY, resolved);
          } else {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
          }
        } catch (e) {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        document.documentElement.style.colorScheme = resolved;
      })();
    </script>
    <style>
      html[data-theme='dark'],
      html:not([data-theme]) {
        background-color: #0b0d0e;
        color: #cfd3d6;
      }
      html[data-theme='light'] {
        background-color: #eceef0;
        color: #2d3236;
      }
    </style>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Circulate</title>
    <meta name="description" content="Private-first item sharing for trusted circles." />
    <meta name="theme-color" content="#121416" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="canonical" href="https://use-circulate.netlify.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://use-circulate.netlify.app/" />
    <meta property="og:title" content="Circulate" />
    <meta property="og:description" content="Private-first sharing for trusted circles. Post items you want to give away, control who can see them, and browse what others are offering." />
    <meta property="og:image" content="https://use-circulate.netlify.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Circulate — Private-first sharing for trusted circles" />
    <meta property="og:site_name" content="Circulate" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Circulate" />
    <meta name="twitter:description" content="Private-first sharing for trusted circles. Post items you want to give away, control who can see them, and browse what others are offering." />
    <meta name="twitter:image" content="https://use-circulate.netlify.app/og-image.png" />
    <meta name="twitter:image:alt" content="Circulate — Private-first sharing for trusted circles" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
